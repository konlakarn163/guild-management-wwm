services:
  - type: web
    name: guild-management-backend
    runtime: node
    rootDir: backend
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://meawmeaw-wwm.konlakarn.space
