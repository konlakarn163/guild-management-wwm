services:
  - type: web
    name: guild-management-backend
    runtime: node
    rootDir: backend
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000,https://meawmeaw-wwm.konlakarn.space
      - key: RUN_DISCORD_AUTOMATION_ON_WEB
        value: "false"

  - type: worker
    name: guild-management-discord-worker
    runtime: node
    rootDir: backend
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start:discord-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_CODE_AUTOMATION_ENABLED
        value: "true"

  - type: cron
    name: guild-management-keepalive
    runtime: node
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: yarn install --frozen-lockfile --production=false
    startCommand: yarn keepalive
    envVars:
      - key: NODE_ENV
        value: production
      - key: KEEPALIVE_URL
        value: https://guild-management-backend.onrender.com/health
