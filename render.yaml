services:
  - type: web
    name: guild-management-backend
    runtime: node
    rootDir: backend
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000,https://meawmeaw-wwm.konlakarn.space
      - key: RUN_COMMAND_ANNOUNCER_ON_WEB
        value: "false"

  - type: worker
    name: guild-management-discord-worker
    runtime: node
    rootDir: backend
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start:discord-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_WEBHOOK_URL
        sync: false
